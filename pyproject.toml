[project]
name = "mantis-agent-sdk"
version = "2.60.0"
description = "Drop-in open-source agent SDK. Multi-model, streaming, MCP, sub-agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "mantis-agent-sdk authors" }]
keywords = ["agent", "llm", "claude", "ollama", "mcp", "tool-use", "streaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18.6",
    "httpx[http2]>=0.27",
    "anyio>=4.4",
    # The `mantis` terminal ships out of the box: `pip install mantis-agent-sdk`
    # gives you a working TUI, no extras. Both are lazy-imported, so the
    # stdlib-only `mantis-agent` diagnostics CLI keeps its snappy cold start.
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/teddyoweh/mantis-agent-sdk"
Repository = "https://github.com/teddyoweh/mantis-agent-sdk"
Issues = "https://github.com/teddyoweh/mantis-agent-sdk/issues"
Changelog = "https://github.com/teddyoweh/mantis-agent-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = []  # uses httpx directly, no SDK dep
openai = []
gemini = []
bedrock = ["boto3>=1.34"]
cli = []  # kept for back-compat: the terminal deps are now core, so this is a no-op
all = ["mantis-agent-sdk[bedrock]"]
dev = [
    "pytest>=8",
    "pytest-anyio>=0.0",
    "ruff>=0.5",
    "respx>=0.21",
    "build>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
mantis = "mantis_agent.tui:main"
mantis-agent = "mantis_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mantis_agent", "mantis_agent_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/mantis_agent",
    "/mantis_agent_sdk",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SEMVER.md",
    "/RELEASING.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The package root is a re-export hub: it deliberately imports the public
# API surface. Names not listed in ``__all__`` are intentional implementation
# detail kept importable, so unused-import (F401) does not apply here.
"mantis_agent/__init__.py" = ["F401"]
# Intentional IPython top-level-await walkthrough: `await` at module scope
# (F704) and imports interleaved with narrative (E402) are the point of the
# example, not bugs.
"mantis_agent/examples/streaming_mode_ipython.py" = ["F704", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
