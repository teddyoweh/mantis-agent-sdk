<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#dededa;font-family:-apple-system,system-ui,sans-serif;padding:26px}
  h4{font:600 12px/1 ui-monospace,monospace;color:#555;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 14px}
  .row{display:flex;align-items:center;gap:22px;margin-bottom:26px}
  .chip{display:grid;place-items:center;border-radius:20px;box-shadow:0 14px 34px -20px rgba(0,0,0,.55)}
  .lt{background:#fff}.dk{background:#111110}.cr{background:#f4f1e9}
  svg{display:block}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="back" x1="0.3" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#2c5e38"/><stop offset="0.45" stop-color="#468950"/><stop offset="1" stop-color="#83c87b"/>
  </linearGradient>
  <linearGradient id="neck" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#6fb46b"/><stop offset="1" stop-color="#356f41"/>
  </linearGradient>
  <linearGradient id="wing" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#63aa60"/><stop offset="0.6" stop-color="#3f7d48"/><stop offset="1" stop-color="#2c5c38"/>
  </linearGradient>
  <linearGradient id="wingsheen" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="femur" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#7ec076"/><stop offset="1" stop-color="#3a7a49"/>
  </linearGradient>
  <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#54985a"/><stop offset="1" stop-color="#295232"/>
  </linearGradient>
  <linearGradient id="legfar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a6f43"/><stop offset="1" stop-color="#234b2e"/>
  </linearGradient>
  <linearGradient id="headg" x1="0.2" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#68ac63"/><stop offset="1" stop-color="#356f41"/>
  </linearGradient>
  <radialGradient id="eye" cx="0.36" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#e6f0c9"/><stop offset="0.4" stop-color="#a6cf82"/>
    <stop offset="0.75" stop-color="#5a9a54"/><stop offset="1" stop-color="#356b3f"/>
  </radialGradient>

  <!-- ===================== ULTRA side-profile mantis ===================== -->
  <g id="mx" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== FAR legs (behind body) ===== -->
    <g fill="none" stroke="url(#legfar)">
      <path stroke-width="2.4" d="M64 68 L54 92 L64 112 L58 122"/>
      <path stroke-width="2.4" d="M74 76 L90 94 L102 114 L112 122"/>
    </g>

    <!-- ===== ABDOMEN (segmented, tapering, curl) ===== -->
    <path fill="url(#back)" stroke="#254f30" stroke-width="0.8"
      d="M60 62 C70 64 84 74 96 90 C104 100 108 110 104 114 C100 118 92 112 86 104
         C76 92 64 80 57 72 C53 67 55 61 60 62 Z"/>
    <g stroke="#254f30" stroke-width="0.6" opacity="0.5" fill="none">
      <path d="M66 70 C70 74 72 78 72 82"/>
      <path d="M74 76 C78 81 80 85 80 90"/>
      <path d="M83 84 C87 89 89 93 89 98"/>
    </g>

    <!-- ===== WING (tegmen) over the back, veined ===== -->
    <path fill="url(#wing)" stroke="#254f30" stroke-width="0.8"
      d="M56 58 C72 58 92 70 108 92 C114 100 114 108 108 108 C100 108 90 100 80 90
         C68 78 58 70 52 64 C49 61 52 57 56 58 Z"/>
    <path fill="url(#wingsheen)"
      d="M56 59 C71 59 89 70 103 89 C107 95 107 100 103 99 C96 98 87 91 78 82
         C67 71 58 66 53 63 C50 61 52 58 56 59 Z"/>
    <!-- venation -->
    <g fill="none" stroke="#2c5c38" stroke-width="0.55" opacity="0.55">
      <path d="M57 61 C70 64 86 74 100 92"/>
      <path d="M56 65 C68 69 82 79 95 96"/>
      <path d="M56 70 C66 74 78 84 90 99"/>
      <path d="M58 75 C66 79 76 88 85 100"/>
    </g>

    <!-- ===== PROTHORAX (long slender neck) ===== -->
    <path fill="url(#neck)" stroke="#254f30" stroke-width="0.8"
      d="M36 41 C41 40 47 45 54 54 C58 59 60 63 58 65 C56 67 52 64 48 59
         C42 51 37 46 34 44 C32 42 34 41 36 41 Z"/>

    <!-- ===== NEAR walking legs ===== -->
    <g fill="none" stroke="url(#leg)">
      <path stroke-width="2.8" d="M60 64 L49 88 L58 110 L51 121"/>
      <path stroke-width="2.8" d="M71 72 L88 92 L99 114 L109 123"/>
      <!-- tarsus ticks -->
      <g stroke-width="1.4"><path d="M51 121 L48 124"/><path d="M109 123 L112 126"/></g>
    </g>
    <!-- femur spine hints on walking legs -->
    <g fill="none" stroke="#2c5636" stroke-width="0.5" opacity="0.7">
      <path d="M54 76 L52 78"/><path d="M57 82 L55 84"/>
    </g>

    <!-- ===== HEAD ===== -->
    <path fill="url(#headg)" stroke="#254f30" stroke-width="0.8"
      d="M35 30 C39 30 42 33 42 38 C42 43 39 47 33 48 C27 49 22 46 22 43
         C22 39 26 33 35 30 Z"/>
    <!-- mandible / mouth -->
    <path fill="#2f6339" d="M23 44 C21 45 20 47 22 47 C24 47 26 46 26 44 Z"/>
    <!-- compound eye -->
    <ellipse cx="33" cy="36" rx="5.4" ry="6.2" fill="url(#eye)" transform="rotate(-18 33 36)"/>
    <ellipse cx="34.5" cy="38.5" rx="1.7" ry="2.1" fill="#213b25" opacity="0.9" transform="rotate(-18 34.5 38.5)"/>
    <circle cx="30.6" cy="32.8" r="1.15" fill="#fff" opacity="0.9"/>
    <!-- antennae -->
    <g fill="none" stroke="#356f41" stroke-width="1.3">
      <path d="M34 29 C26 19 18 12 8 8"/>
      <path d="M37 30 C31 20 24 12 15 6"/>
    </g>

    <!-- ===== RAPTORIAL FORELEGS (folded prayer, spined) ===== -->
    <!-- far foreleg -->
    <g fill="none" stroke="#3a7047">
      <path stroke-width="3.2" d="M55 60 L45 49 L33 43 L43 40"/>
    </g>
    <!-- near foreleg : coxa -> femur -> tibia -->
    <path fill="url(#femur)" stroke="#254f30" stroke-width="0.7"
      d="M54 61 C51 57 48 53 44 50 C41 48 39 49 40 51 C42 55 46 59 50 62 C52 63 55 63 54 61 Z"/>
    <!-- femur (grasping) -->
    <path fill="url(#femur)" stroke="#254f30" stroke-width="0.7"
      d="M44 50 C40 47 34 44 29 43 C26.5 42.5 25.5 44 27.5 45.5 C32 49 38 52 42 54 C44 55 46 51.5 44 50 Z"/>
    <!-- tibia (folded blade with hook) -->
    <path fill="url(#femur)" stroke="#254f30" stroke-width="0.7"
      d="M29 43 C33 40.5 39 39 44 39 C46.5 39 47 41 45 42 C41 44 35 46 31.5 46.5 C29.5 46.8 27 44.2 29 43 Z"/>
    <!-- femur inner spines -->
    <g fill="none" stroke="#dc9265" stroke-width="0.75" opacity="0.92">
      <path d="M31 45.6 L31.8 47.2"/><path d="M34.5 47 L35.2 48.7"/><path d="M38 48.6 L38.6 50.3"/><path d="M41 50 L41.5 51.7"/>
    </g>
  </g>
</defs></svg>

<h4>ultra side-profile mantis — v1</h4>
<div class="row">
  <div class="chip lt" style="width:220px;height:220px"><svg width="188" height="188" viewBox="0 0 128 128"><use href="#mx"/></svg></div>
  <div class="chip dk" style="width:220px;height:220px"><svg width="188" height="188" viewBox="0 0 128 128"><use href="#mx"/></svg></div>
  <div class="chip cr" style="width:120px;height:120px"><svg width="104" height="104" viewBox="0 0 128 128"><use href="#mx"/></svg></div>
  <div class="chip lt" style="width:60px;height:60px"><svg width="50" height="50" viewBox="0 0 128 128"><use href="#mx"/></svg></div>
  <div class="chip lt" style="width:38px;height:38px"><svg width="30" height="30" viewBox="0 0 128 128"><use href="#mx"/></svg></div>
</div>

</body></html>
