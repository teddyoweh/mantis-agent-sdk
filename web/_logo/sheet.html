<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#e9e9e6;font-family:-apple-system,system-ui,sans-serif;padding:26px}
  h4{font:600 12px/1 ui-monospace,monospace;color:#555;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 12px}
  .row{display:flex;align-items:center;gap:20px;margin-bottom:30px}
  .chip{display:grid;place-items:center;border-radius:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
  .lt{background:#fff}.dk{background:#111110}.wash{background:#f3f3f1}
  svg{display:block}
</style></head><body>

<!-- shared defs -->
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="body" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#7fbf7a"/>
    <stop offset="0.5" stop-color="#4e9155"/>
    <stop offset="1" stop-color="#356b40"/>
  </linearGradient>
  <linearGradient id="foreleg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5fa065"/>
    <stop offset="1" stop-color="#2f5d3a"/>
  </linearGradient>
  <radialGradient id="eye" cx="0.35" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#e8895c"/>
    <stop offset="0.6" stop-color="#bd5a37"/>
    <stop offset="1" stop-color="#8f3f24"/>
  </radialGradient>

  <!-- ============ V1 : side-profile prayer ============ -->
  <g id="v1">
    <!-- walking legs -->
    <g fill="none" stroke="#2f5d3a" stroke-width="1.6" stroke-linecap="round">
      <path d="M31 30 L27 42 L23 50"/>
      <path d="M35 33 L37 46 L34 54"/>
      <path d="M40 37 L47 47 L52 53"/>
    </g>
    <!-- abdomen + thorax -->
    <path fill="url(#body)" stroke="#2f5d3a" stroke-width="0.8" stroke-linejoin="round"
      d="M26 17 C24 22 27 26 30 30 C36 37 45 43 51 48 C53 49.5 53.5 46.5 51.5 45
         C45 40 38 34 33 28 C30 24 29 20 28.5 16.5 C28 15 26.8 15 26 17 Z"/>
    <!-- neck -->
    <path fill="url(#body)" stroke="#2f5d3a" stroke-width="0.8" stroke-linejoin="round"
      d="M27 17 C25.5 15 24 13.5 22.5 12.5 C24 12 26 13 27.5 14.5 Z"/>
    <!-- head -->
    <path fill="#3f7a4a" stroke="#2f5d3a" stroke-width="0.7" stroke-linejoin="round"
      d="M24 10.5 L15.5 12.6 L24.2 15.4 C25.6 14 25.8 11.8 24 10.5 Z"/>
    <!-- eye -->
    <ellipse cx="19" cy="12.6" rx="2.5" ry="2.9" fill="url(#eye)"/>
    <circle cx="18.1" cy="11.6" r="0.7" fill="#fff" opacity="0.85"/>
    <!-- antennae -->
    <g fill="none" stroke="#356b40" stroke-width="1.2" stroke-linecap="round">
      <path d="M17 11 C13 7 11 5 8.5 3.5"/>
      <path d="M20 10 C17 6.5 15.5 4.5 13.5 2.8"/>
    </g>
    <!-- raptorial forelegs (prayer) -->
    <g fill="none" stroke="url(#foreleg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 18 L13.5 21 L22.5 13.5"/>
    </g>
    <g fill="none" stroke="url(#foreleg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27.5 20 L16 24 L24 15"/>
    </g>
    <!-- foreleg spines -->
    <g fill="none" stroke="#e8b98f" stroke-width="0.5" stroke-linecap="round" opacity="0.8">
      <path d="M15 20.4 L16 22"/><path d="M17.5 19.8 L18.4 21.3"/><path d="M20 19.2 L20.8 20.6"/>
    </g>
  </g>

  <!-- ============ V2 : compact head + forelegs emblem ============ -->
  <g id="v2">
    <!-- forelegs framing, symmetric-ish prayer -->
    <g fill="none" stroke="url(#foreleg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 30 L18 26 L28 15"/>
      <path d="M32 30 L46 26 L36 15"/>
    </g>
    <!-- thorax -->
    <path fill="url(#body)" stroke="#2f5d3a" stroke-width="0.8"
      d="M32 46 C28.5 46 27 42 28 34 C28.6 29 31 27 32 27 C33 27 35.4 29 36 34 C37 42 35.5 46 32 46 Z"/>
    <!-- head -->
    <path fill="#3f7a4a" stroke="#2f5d3a" stroke-width="0.7"
      d="M32 12 C35.5 12 37.5 15 37.5 18.5 C37.5 22 35 24.5 32 24.5 C29 24.5 26.5 22 26.5 18.5 C26.5 15 28.5 12 32 12 Z"/>
    <!-- eyes -->
    <ellipse cx="29.6" cy="18" rx="2.3" ry="2.9" fill="url(#eye)"/>
    <ellipse cx="34.4" cy="18" rx="2.3" ry="2.9" fill="url(#eye)"/>
    <circle cx="29" cy="17" r="0.6" fill="#fff" opacity="0.85"/>
    <circle cx="33.8" cy="17" r="0.6" fill="#fff" opacity="0.85"/>
    <!-- antennae -->
    <g fill="none" stroke="#356b40" stroke-width="1.3" stroke-linecap="round">
      <path d="M29.5 13 C27 9 25.5 7 24 5.5"/>
      <path d="M34.5 13 C37 9 38.5 7 40 5.5"/>
    </g>
  </g>

  <!-- ============ V3 : dynamic strike ============ -->
  <g id="v3">
    <path fill="none" stroke="#2f5d3a" stroke-width="1.5" stroke-linecap="round"
      d="M34 32 L34 46 L30 54 M39 34 L44 46 L42 55"/>
    <path fill="url(#body)" stroke="#2f5d3a" stroke-width="0.8" stroke-linejoin="round"
      d="M30 16 C27 22 30 28 34 33 C40 40 47 47 50 54 C51 56 48 57 46.5 55 C42 48 36 41 32 35 C29 31 28 24 28 19 C28 16.5 29 15 30 16 Z"/>
    <path fill="#3f7a4a" stroke="#2f5d3a" stroke-width="0.7"
      d="M29 12 L20 12.5 L28.5 16.5 C30.5 15.5 30.8 13 29 12 Z"/>
    <ellipse cx="23.5" cy="13" rx="2.6" ry="3" fill="url(#eye)"/>
    <circle cx="22.6" cy="12" r="0.7" fill="#fff" opacity="0.85"/>
    <g fill="none" stroke="#356b40" stroke-width="1.2" stroke-linecap="round">
      <path d="M22 11 C17 8 14 6 11 5"/>
      <path d="M25 9.5 C21 6 18 4.5 15 3.5"/>
    </g>
    <!-- striking forelegs extended forward -->
    <g fill="none" stroke="url(#foreleg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 18 L14 15 L5 9"/>
      <path d="M30 20 L16 19 L7 14"/>
    </g>
  </g>
</defs></svg>

<h4>V1 — side-profile prayer</h4>
<div class="row">
  <div class="chip lt" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
  <div class="chip dk" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
  <div class="chip lt" style="width:56px;height:56px"><svg width="44" height="44" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
  <div class="chip lt" style="width:40px;height:40px"><svg width="30" height="30" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
  <div class="chip lt" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
  <div class="chip dk" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v1"/></svg></div>
</div>

<h4>V2 — compact emblem (front head + forelegs)</h4>
<div class="row">
  <div class="chip lt" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
  <div class="chip dk" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
  <div class="chip lt" style="width:56px;height:56px"><svg width="44" height="44" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
  <div class="chip lt" style="width:40px;height:40px"><svg width="30" height="30" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
  <div class="chip lt" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
  <div class="chip dk" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v2"/></svg></div>
</div>

<h4>V3 — dynamic strike</h4>
<div class="row">
  <div class="chip lt" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
  <div class="chip dk" style="width:132px;height:132px"><svg width="104" height="104" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
  <div class="chip lt" style="width:56px;height:56px"><svg width="44" height="44" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
  <div class="chip lt" style="width:40px;height:40px"><svg width="30" height="30" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
  <div class="chip lt" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
  <div class="chip dk" style="width:30px;height:30px"><svg width="22" height="22" viewBox="0 0 64 64"><use href="#v3"/></svg></div>
</div>

</body></html>
